# Fast checks of the published configuration, on every push and pull
# request: the steps of suite.yml with tests/run fast, that is the
# static checks, the logic tests and the L1 scenarios.  full.yml runs
# the slow tiers.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release script of cd.yml, which no other job runs.
  release-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p release_test.py

  fast:
    uses: ./.github/workflows/suite.yml
    with:
      profile: fast
      timeout-minutes: 90
