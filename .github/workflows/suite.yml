# The steps that test the published configuration, which ci.yml and
# full.yml call with their profile.  The matrix crosses Linux, with the
# packages of the NixOS machine from the configuration's flake, and macOS,
# with the Emacs of the Mac's Brewfile, with GNU Emacs and neomacs.  A
# neomacs job ends green whatever it finds: each of its steps continues
# on error, and its summary says how far it got.  The packages' sources
# are cached once for every job, their builds once per Emacs.
name: Suite

on:
  workflow_call:
    inputs:
      profile:
        description: "fast, or full followed by the session checks"
        required: true
        type: string
      timeout-minutes:
        required: true
        type: number

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.system }}, ${{ matrix.emacs }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    continue-on-error: ${{ matrix.emacs == 'neomacs' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: linux, emacs: gnu, runner: ubuntu-24.04, shell: linux, gui: ""}
          - {system: linux, emacs: neomacs, runner: ubuntu-24.04, shell: linux-neomacs, gui: "0"}
          - {system: macos, emacs: gnu, runner: macos-15, shell: darwin, gui: "0"}
          - {system: macos, emacs: neomacs, runner: macos-15, shell: darwin, gui: "0"}
    env:
      # The bootstrap installs the packages in the checkout, and the
      # tests read them from there.
      EMACS_LIVE_DIR: ${{ github.workspace }}
      # Graphical frames on Linux's private Xvfb displays only: macOS has
      # none, and neomacs's daemon refuses graphical frames.
      EMACS_TEST_GUI: ${{ matrix.gui }}
      WANTED_EMACS: ${{ matrix.emacs }}
    defaults:
      run:
        # The flake's programs come first on PATH, and a failing command
        # in a pipe fails its step.  nix develop moves TMPDIR into a longer
        # directory; macOS's is long already, and a session's socket path
        # must stay short (tests/runner/sessions.py): use /tmp.
        shell: nix develop .#${{ matrix.shell }} --command env TMPDIR=/tmp bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b

      - name: Install the Emacs of the Brewfile
        if: matrix.system == 'macos'
        shell: bash
        run: brew install --cask jimeh/emacs-builds/emacs-app

      - name: Install neomacs on Linux
        if: matrix.system == 'linux' && matrix.emacs == 'neomacs'
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        shell: bash -eo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download --repo eval-exec/neomacs --pattern '*_amd64.deb' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          sudo apt-get update
          sudo apt-get install --yes ./neomacs_*_amd64.deb

      - name: Install neomacs on macOS
        if: matrix.system == 'macos' && matrix.emacs == 'neomacs'
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        shell: bash
        run: brew install --cask neomacs-core/tap/neomacs

      - name: Put neomacs first on PATH as emacs
        if: matrix.emacs == 'neomacs'
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        shell: bash -eo pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/neomacs-bin"
          printf '#!/bin/sh\nexec neomacs "$@"\n' > "$RUNNER_TEMP/neomacs-bin/emacs"
          chmod +x "$RUNNER_TEMP/neomacs-bin/emacs"
          echo "$RUNNER_TEMP/neomacs-bin" >> "$GITHUB_PATH"

      - name: Show the Emacs under test
        id: emacs
        timeout-minutes: 5
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          # Whole output first: head would end the pipe early.
          emacs --version > "$RUNNER_TEMP/version.txt"
          head -n 1 "$RUNNER_TEMP/version.txt" | tee "$RUNNER_TEMP/emacs-version"
          # The byte code depends on the version; a cache key holds no comma.
          echo "key=$(tr -c 'A-Za-z0-9.\n' '-' < "$RUNNER_TEMP/emacs-version")" >> "$GITHUB_OUTPUT"
          command -v emacs emacsclient
          if [ "$WANTED_EMACS" = neomacs ]; then
            test "$(command -v emacs)" = "$RUNNER_TEMP/neomacs-bin/emacs"
          else
            grep -q '^GNU Emacs' "$RUNNER_TEMP/emacs-version"
          fi

      # straight checks out a pin when it clones only: a cache made from
      # another lock file would leave repositories off their pins, so the
      # keys match exactly, with no fallback.
      - name: Restore the packages' sources
        id: repos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: straight/repos
          key: straight-repos-${{ hashFiles('straight/versions/default.el') }}

      - name: Restore the packages' builds for this Emacs
        id: builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            straight/build
            straight/build-cache.el
          key: straight-build-${{ matrix.system }}-${{ matrix.emacs }}-${{ steps.emacs.outputs.key }}-${{ hashFiles('straight/versions/default.el') }}

      # The setup of the configuration's flake (nix/setup.sh), with the
      # matrix's Emacs: first the packages, then the modules, so that the
      # caches are saved without the modules of jinx and ghostel, whatever
      # the tests find.
      - name: Install the packages from the lock file, at their pins
        id: packages
        timeout-minutes: 35
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        run: nix/setup.sh --strict packages .

      - name: Save the packages' sources
        if: steps.packages.outcome == 'success' && steps.repos.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: straight/repos
          key: ${{ steps.repos.outputs.cache-primary-key }}

      - name: Save the packages' builds for this Emacs
        if: steps.packages.outcome == 'success' && steps.builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            straight/build
            straight/build-cache.el
          key: ${{ steps.builds.outputs.cache-primary-key }}

      # neomacs's package comes from outside the Nix shell, so its module
      # gets the system's compiler and enchant here, where the modules step
      # below, and then the sessions, find the file.  jinx loads any file it
      # finds, the restored cache's or a session's: remove it first.
      - name: Build jinx's module with neomacs and the system's compiler
        id: jinx
        if: matrix.system == 'linux' && matrix.emacs == 'neomacs'
        timeout-minutes: 5
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        shell: bash -eo pipefail {0}
        run: |
          sudo apt-get install --yes libenchant-2-dev pkg-config
          rm -f straight/build/jinx/jinx-mod.so
          status=0
          emacs --batch -Q -L straight/build/compat -L straight/build/jinx --eval '
            (condition-case failure
                (progn (require (quote jinx))
                       (jinx--load-module)
                       (message "jinx: the module loads"))
              (error
               (when-let* ((compilation (get-buffer "*jinx module compilation*")))
                 (message "%s" (with-current-buffer compilation (buffer-string))))
               (message "jinx: %s" (error-message-string failure))
               (kill-emacs 1)))' || status=$?
          ldd straight/build/jinx/jinx-mod.so || true
          exit "$status"

      - name: Install the grammars, the modules and CIDER's dependencies
        id: modules
        timeout-minutes: 20
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          # Journey 14, which needs CIDER's dependencies, runs in full only.
          if [ "$PROFILE" = full ]; then
            nix/setup.sh modules .
          else
            nix/setup.sh --no-cider modules .
          fi

      - name: Check that sessions find the flake's programs
        timeout-minutes: 5
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        run: |
          # A session takes PATH from a login shell (exec-path-from-shell),
          # whose profiles put /usr/bin and Homebrew first on macOS: end
          # each login profile with this PATH.
          for profile in ~/.zprofile ~/.bash_profile; do
            printf 'export PATH=%q\n' "$PATH" >> "$profile"
          done
          # Its grammars are the flake's: no rebuild in the background.
          emacs --init-directory="$GITHUB_WORKSPACE" --daemon=paths \
            --eval '(setq my/treesit-refresh-at-startup nil)'
          emacsclient --socket-name=paths --eval \
            "(with-temp-file \"$RUNNER_TEMP/found\" (dolist (p (split-string \"$CI_PROGRAMS\")) (insert p \" \" (or (executable-find p) \"none\") \"\n\")))"
          emacsclient --socket-name=paths --eval '(kill-emacs)'
          cat "$RUNNER_TEMP/found"
          if grep -v ' /nix/store/' "$RUNNER_TEMP/found"; then exit 1; fi

      - name: Run the static checks
        id: static
        timeout-minutes: 5
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        run: tests/run static

      # A machine's first clojure-lsp analyses the JDK's sources into the
      # user's cache, which took over 120 s on macOS's runner.  The flake
      # pins clojure-lsp and the JDK, so its lock file keys that cache.
      - name: Restore clojure-lsp's cache of the JDK
        id: clojure-lsp
        if: inputs.profile == 'full'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/clojure-lsp
          key: clojure-lsp-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      # Without the cache, pay for it here, once, not in whichever row
      # comes first.  The suite reports a failure: this step never fails
      # the job.
      - name: Warm clojure-lsp's cache of the JDK
        id: warm
        if: inputs.profile == 'full' && matrix.emacs == 'gnu' && steps.clojure-lsp.outputs.cache-hit != 'true'
        timeout-minutes: 8
        continue-on-error: true
        run: tests/run full l3-clojure-lsp-format

      # Right after the warm-up: a job whose suite fails still saves it.
      - name: Save clojure-lsp's cache of the JDK
        if: steps.warm.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/clojure-lsp
          key: ${{ steps.clojure-lsp.outputs.cache-primary-key }}

      - name: Run tests/run ${{ inputs.profile }}
        id: tests
        # Below the job's own timeout, so that a hang fails the step, which
        # a neomacs job's continue-on-error then absorbs.
        timeout-minutes: ${{ inputs.profile == 'full' && 75 || 30 }}
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        env:
          PROFILE: ${{ inputs.profile }}
        run: '{ time tests/run "$PROFILE"; } 2>&1 | tee "$RUNNER_TEMP/logs/$PROFILE.log"'

      - name: Run the session checks
        id: session
        if: inputs.profile == 'full'
        timeout-minutes: 10
        continue-on-error: ${{ matrix.emacs == 'neomacs' }}
        run: '{ time tests/integrity/session/run; } 2>&1 | tee "$RUNNER_TEMP/logs/session.log"'

      - name: Show the sessions the runner kept
        # A neomacs job does not fail, and its kept sessions matter too.
        if: always()
        shell: bash
        run: |
          { grep -ho 'kept /[^ ]*' "$RUNNER_TEMP"/logs/*.log 2>/dev/null || true; } |
            cut -d ' ' -f 2 |
            while read -r session; do
              echo "::group::$session"
              tail -n 40 "$session/messages.txt" "$session/emacs.log" 2>/dev/null || true
              echo "::endgroup::"
            done

      - name: Summarise
        if: always()
        shell: bash
        env:
          # Each step's own outcome, before a neomacs job continues past it.
          OUTCOMES: >-
            packages ${{ steps.packages.outcome }},
            jinx ${{ steps.jinx.outcome }},
            modules ${{ steps.modules.outcome }},
            static ${{ steps.static.outcome }},
            tests ${{ steps.tests.outcome }},
            session checks ${{ steps.session.outcome }}
        run: |
          {
            echo "### ${{ matrix.system }}, ${{ matrix.emacs }}"
            echo
            echo "Emacs: $(cat "$RUNNER_TEMP/emacs-version" 2>/dev/null || echo 'not reached')"
            echo
            echo "Steps: $OUTCOMES"
            for log in "$RUNNER_TEMP"/logs/*.log; do
              [ -f "$log" ] || continue
              echo
              echo "$(basename "$log" .log):"
              echo '```'
              grep -E '^(fast|full):|^(ok|FAIL) +integrity|^real' "$log" || tail -n 3 "$log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
