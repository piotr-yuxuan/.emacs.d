# Plan 119, step 1d: why does the output of Treemacs's collapse helper
# read as empty on macOS, and does a pipe stop it?  Temporary: plan 119
# removes it once it knows.  It runs the Treemacs scenarios again and
# again with .github/treemacs-probe.el appended to the clone's init.el,
# then again with .github/treemacs-pipe.el appended too.
name: Treemacs probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      EMACS_TEST_GUI: "0"
      TMPDIR: /tmp
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Follow Getting started on macOS
        timeout-minutes: 30
        run: |
          python3 tests/tools/doc-block macos docs/tutorials/getting-started.org > "$RUNNER_TEMP/beginner.sh"
          bash -eo pipefail "$RUNNER_TEMP/beginner.sh"
          git -C ~/emacs-config fetch --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git -C ~/emacs-config checkout --quiet --detach "$GITHUB_SHA"

      - name: Install every package
        timeout-minutes: 40
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd ~/emacs-config
          nix/setup.sh packages

      - name: Run the Treemacs scenarios as they are, then on a pipe
        timeout-minutes: 45
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd ~/emacs-config
          cat .github/treemacs-probe.el >> init.el
          for phase in pty pipe; do
            if [ "$phase" = pipe ]; then
              cat .github/treemacs-pipe.el >> init.el
              echo "--- now on a pipe" >> ~/read-eof.log
            fi
            failed=0
            for i in $(seq 1 60); do
              if ! tests/run fast l1-treemacs > "$RUNNER_TEMP/$phase-$i.log" 2>&1; then
                failed=$((failed + 1))
                grep -E '^FAIL|unexpected error' "$RUNNER_TEMP/$phase-$i.log" || true
              fi
            done
            echo "$phase: 60 runs, $failed failing"
          done

      - name: Print the states recorded
        if: always()
        run: cat ~/read-eof.log 2>/dev/null || echo 'nothing recorded'
