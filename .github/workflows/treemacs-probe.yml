# Plan 119, step 1b: which read ends in "End of file during parsing"
# when Treemacs opens a project on macOS?  Temporary: plan 119 removes
# it once it knows.  It runs the Treemacs scenarios again and again,
# with .github/treemacs-probe.el appended to the clone's init.el.
name: Treemacs probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EMACS_TEST_GUI: "0"
      TMPDIR: /tmp
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Follow Getting started on macOS
        timeout-minutes: 30
        run: |
          python3 tests/tools/doc-block macos docs/tutorials/getting-started.org > "$RUNNER_TEMP/beginner.sh"
          bash -eo pipefail "$RUNNER_TEMP/beginner.sh"
          git -C ~/emacs-config fetch --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git -C ~/emacs-config checkout --quiet --detach "$GITHUB_SHA"

      - name: Install every package
        timeout-minutes: 40
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd ~/emacs-config
          nix/setup.sh packages

      - name: Run the Treemacs scenarios again and again
        timeout-minutes: 40
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cat .github/treemacs-probe.el >> ~/emacs-config/init.el
          cd ~/emacs-config
          failed=0
          for i in $(seq 1 40); do
            if ! tests/run fast l1-treemacs > "$RUNNER_TEMP/run-$i.log" 2>&1; then
              failed=$((failed + 1))
              grep -E '^FAIL|unexpected error' "$RUNNER_TEMP/run-$i.log" || true
            fi
          done
          echo "runs: 40, failing: $failed"

      - name: Print the log of the reads that ended early
        if: always()
        run: cat ~/read-eof.log 2>/dev/null || echo 'no read ended early'
